name: build for mac

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build macos
        run: flutter build macos

      - name: Zip built app
        run: |
          zip -r -X eureka_mac.zip build/macos/Build/Products/Release/eureka.app

      - name: Extract app version with validation
        id: extract_version
        run: |
          VERSION=$(grep -E "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format extracted: '$VERSION'"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
          
      - name: Create or update tag and release (with overwrite)
        run: |
          TAG_NAME="v${{ env.APP_VERSION }}"
          
          # Configure git user
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Create local tag if it doesn't exist
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Local tag $TAG_NAME already exists"
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            echo "Created local tag: $TAG_NAME"
          fi
          
          # Force push tag (overwrite if exists remotely)
          git push origin "$TAG_NAME" --force
          echo "Force pushed tag: $TAG_NAME"
          
          # Create or update release with clobber
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Automated release by GitHub Actions, for macOS platform" \
            eureka_mac.zip \
            --clobber
          echo "Successfully created/updated release: $TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}