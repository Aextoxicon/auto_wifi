name: build all platforms

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build_windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build windows
        run: flutter build windows

      - name: Package Windows build
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/" -DestinationPath "eureka_win.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eureka_win
          path: eureka_win.zip

  build_linux:
    needs: build_windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build linux
        run: flutter build linux

      - name: Package linux build
        run: |
          cd build/linux/x64/release
          tar -czf ../../../eureka_linux.tar.gz bundle/
          cd ../../..
          echo "Packaged eureka_linux.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: eureka_linux
          path: eureka_linux.tar.gz

  build_mac:
    needs: build_linux
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build macos
        run: flutter build macos

      - name: Zip built app
        run: |
          zip -r -X eureka_mac.zip build/macos/Build/Products/Release/eureka.app

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: eureka_win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: eureka_linux

      - name: Extract app version with validation
        id: extract_version
        run: |
          VERSION=$(grep -E "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format extracted: '$VERSION'"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create tag and release with all platform files
        run: |
          TAG_NAME="v${{ env.APP_VERSION }}"
          
          # Configure git user
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Create local tag if it doesn't exist
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Local tag $TAG_NAME already exists"
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            echo "Created local tag: $TAG_NAME"
          fi
          
          # Force push tag (overwrite if exists remotely)
          git push origin "$TAG_NAME" --force
          echo "Force pushed tag: $TAG_NAME"
          
          # Create release with all platform files
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Automated release by GitHub Actions" \
            eureka_mac.zip \
            eureka_win.zip \
            eureka_linux.tar.gz \
            --clobber
          echo "Successfully created/updated release with all platform files: $TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}