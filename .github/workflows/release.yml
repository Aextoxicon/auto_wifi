name: Release Manager

on:
  workflow_run:
    workflows: ["build for windows and android"]
    types: [completed]
  workflow_dispatch:

jobs:
  manage-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          VERSION=$(grep -E "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Wait for all builds to complete
        run: |
          sleep 60

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
    
      - name:  Unzip android artifacts
        run: |
          cd ./artifacts && unzip app-release.zip && rm app-release.zip

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ env.APP_VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create unified release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}