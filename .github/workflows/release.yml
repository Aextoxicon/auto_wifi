name: Release Manager

on:
  workflow_run:
    workflows: ["build for mac", "build for windows and android"]
    types: [completed]
  workflow_dispatch:

jobs:
  manage-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          VERSION=$(grep -E "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Wait for all builds to complete
        run: |
          sleep 120

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
    
      - name: Check downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f
          ls -la ./artifacts/

      - name: Process artifacts for release
        run: |
          mkdir -p ./release_files
          
          # 处理Mac应用
          if [ -d "./artifacts/eureka_mac" ]; then
            cd ./artifacts/eureka_mac
            zip -r ../../release_files/eureka-mac-v${{ env.APP_VERSION }}.zip .
            cd ../..
          fi
          
          # 处理Windows应用
          if [ -d "./artifacts/eureka_win" ]; then
            cd ./artifacts/eureka_win
            zip -r ../../release_files/eureka-windows-v${{ env.APP_VERSION }}.zip .
            cd ../..
          fi
          
          # 处理Android APK
          if [ -f "./artifacts/app-release/app-release.apk" ]; then
            cp ./artifacts/app-release/app-release.apk ./release_files/eureka-android-v${{ env.APP_VERSION }}.apk
          fi
          
          echo "Processed files:"
          ls -la ./release_files/

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ env.APP_VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create unified release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            ./release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}