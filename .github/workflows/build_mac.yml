name: build for mac

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: Extract app version
        run: |
          # 从 pubspec.yaml 中提取 version 字段（格式如 version: 1.0.0+1）
          VERSION=$(grep -E "^version:" pubspec.yaml | awk '{print $2}')
          echo "$VERSION" > version.txt
          cat version.txt

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build macos
        run: flutter build macos

      - name: Upload macos zip and version.txt
        env: 
          API_TOKEN: ${{ secrets.API_TOKEN }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
        run: |
          zip -r -X eureka_mac.zip build/macos/Build/Products/Release/eureka.app
          curl --http1.1 -X POST -H "Authorization: Bearer $API_TOKEN" -F "file=@eureka_mac.zip" $UPLOAD_URL
          curl --http1.1 -X POST -H "Authorization: Bearer $API_TOKEN" -F "file=@version.txt" $UPLOAD_URL