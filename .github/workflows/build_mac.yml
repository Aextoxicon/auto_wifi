name: build for mac

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: Extract app version with validation
        id: extract_version
        run: |
          VERSION=$(grep -E "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format extracted: '$VERSION'"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Upload version.txt to file server
        run: |
          curl --http1.1 -X POST \
            -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
            -F "file=@version.txt" \
            "${{ secrets.UPLOAD_URL }}"
          echo "Successfully uploaded version.txt to file server using provided command format"
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build macos
        run: flutter build macos

      - name: Zip built app
        run: |
          zip -r -X eureka_mac.zip build/macos/Build/Products/Release/eureka.app

      - name: Create Release and Tag using action-gh-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          body: |
            ## Release v${{ env.APP_VERSION }}
            
            Automated macOS release created by build workflow.
            
            ### What's included:
            - macOS application package (.app)
            - Built with Flutter 3.35.4
            - Cross-platform version synchronization enabled
            
            ### Build Details:
            - Platform: macOS
            - Architecture: Universal (arm64/x86_64)
            - Build Type: Release
          files: eureka_mac.zip
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}