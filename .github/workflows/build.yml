name: build for windows and android

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"

      - name: Download version.txt from file server using PowerShell
        id: get_version
        run: |
          try {
            $serverUrl = $env:UPLOAD_URL
            $apiToken = $env:API_TOKEN
            
            $downloadUrl = "${serverUrl}/version.txt"
            
            $headers = @{
              "Authorization" = "Bearer ${apiToken}"
              "User-Agent" = "GitHub-Actions/1.0"
            }
            
            Write-Host "Downloading version.txt from: $downloadUrl"
            
            $response = Invoke-WebRequest -Uri $downloadUrl -Method GET -Headers $headers -UseBasicParsing
            
            $response.Content | Out-File -FilePath "version.txt" -Encoding UTF8
            
            if (Test-Path "version.txt") {
              $VERSION = Get-Content "version.txt" -Raw | ForEach-Object { $_.Trim() }
              if ($VERSION -and $VERSION -match "^\d+\.\d+\.\d+$") {
                echo "APP_VERSION=$VERSION" >> $env:GITHUB_ENV
                echo "version=$VERSION" >> $env:GITHUB_OUTPUT
                Write-Host "Successfully extracted version from file server: $VERSION"
              } else {
                throw "Invalid version format in version.txt: '$VERSION'"
              }
            } else {
              throw "version.txt not downloaded successfully"
            }
          } catch {
            Write-Warning "Failed to download version.txt from file server: $($_.Exception.Message)"
            Write-Host "Falling back to extracting version from pubspec.yaml"
            
            try {
              $content = Get-Content "pubspec.yaml" -ErrorAction Stop
              $versionLine = $content | Where-Object { $_ -match "^version:" }
              if ($versionLine) {
                $cleanLine = $versionLine -replace "^version:\s*", ""
                $VERSION = $cleanLine -split "\+" | Select-Object -First 1
                $VERSION = $VERSION.Trim()
                if ($VERSION -and $VERSION -match "^\d+\.\d+\.\d+$") {
                  echo "APP_VERSION=$VERSION" >> $env:GITHUB_ENV
                  echo "version=$VERSION" >> $env:GITHUB_OUTPUT
                  Write-Host "Extracted version from pubspec.yaml: $VERSION"
                } else {
                  throw "Invalid version format: $VERSION"
                }
              } else {
                throw "Version line not found in pubspec.yaml"
              }
            } catch {
              Write-Error "Failed to extract version from pubspec.yaml: $($_.Exception.Message)"
              exit 1
            }
          }
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Debug version info
        run: |
          Write-Host "APP_VERSION from env: ${{ env.APP_VERSION }}"
          Write-Host "Version from step output: ${{ steps.get_version.outputs.version }}"

      - name: install dep
        run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons

      - name: build windows
        run: flutter build windows

      - name: build android
        run: flutter build apk

      - name: Package Windows build
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/" -DestinationPath "eureka_win.zip"

      - name: Check if release already exists
        id: check_release
        run: |
          try {
            $tagName = "v${{ env.APP_VERSION }}"
            gh release view "$tagName" > $null 2>&1
            if ($LASTEXITCODE -eq 0) {
              echo "Release $tagName already exists"
              echo "RELEASE_EXISTS=true" >> $env:GITHUB_ENV
              echo "exists=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "Release $tagName does not exist"
              echo "RELEASE_EXISTS=false" >> $env:GITHUB_ENV
              echo "exists=false" >> $env:GITHUB_OUTPUT
            }
          } catch {
            Write-Warning "Failed to check release: $_"
            echo "RELEASE_EXISTS=false" >> $env:GITHUB_ENV
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag if needed
        if: ${{ steps.check_release.outputs.exists == 'false' }}
        run: |
          try {
            $tagName = "v${{ env.APP_VERSION }}"
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            if (git tag --list | Where-Object { $_ -eq $tagName }) {
              Write-Host "Local tag $tagName already exists"
            } else {
              git tag -a "$tagName" -m "Release $tagName"
            }
            git push origin "$tagName"
            echo "Successfully created and pushed tag: $tagName"
          } catch {
            Write-Error "Failed to create tag: $_"
            exit 1
          }

      - name: Create new release with files
        if: ${{ steps.check_release.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          body: |
            ## Release v${{ env.APP_VERSION }}
            
            Automated release for Windows and Android platforms.
            
            ### Included files:
            - Windows executable package
            - Android APK
          files: |
            eureka_win.zip
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload additional files to existing release
        if: ${{ steps.check_release.outputs.exists == 'true' }}
        run: |
          try {
            $tagName = "v${{ env.APP_VERSION }}"
            gh release upload "$tagName" eureka_win.zip build/app/outputs/flutter-apk/app-release.apk --clobber
            echo "Successfully uploaded files to existing release: $tagName"
          } catch {
            Write-Error "Failed to upload files to existing release: $_"
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}